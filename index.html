<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#070707">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Mon Budget</title>
<style>
:root{
  --bg:#070707; --card:#111111; --card2:#0b0b0b;
  --line:rgba(212,175,55,.22); --line-strong:rgba(212,175,55,.55);
  --gold:#d4af37; --gold-l:#f3dc7c; --gold-d:#9c7a1c;
  --goldgrad:linear-gradient(135deg,#f6e27a 0%,#d4af37 45%,#a8811f 100%);
  --text:#f2efe6; --muted:#9a958a; --faint:#5f5b52;
  --ok:#5cc98a; --warn:#f0a03c; --over:#f2555a;
  --r:18px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:15px;-webkit-font-smoothing:antialiased}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
body{min-height:100vh;
  background:
    radial-gradient(120% 60% at 100% 0%,rgba(212,175,55,.13),transparent 55%),
    radial-gradient(90% 50% at 0% 100%,rgba(212,175,55,.07),transparent 60%),
    var(--bg);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
input,select{font-size:16px} /* évite le zoom auto sur iPhone */

/* ---------- En-tête ---------- */
header{position:sticky;top:0;z-index:5;padding:calc(var(--safe-t) + 12px) 18px 10px;
  background:linear-gradient(#070707 70%,rgba(7,7,7,0));overflow:hidden}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand h1{margin:0;font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;
  background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.swirl{position:absolute;right:-40px;top:-30px;width:220px;height:140px;pointer-events:none;opacity:.55}
.monthnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.monthnav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--gold);font-size:18px}
.monthnav .m{font-size:20px;font-weight:600;min-width:170px;text-align:center;text-transform:capitalize}

main{padding:4px 16px calc(96px + var(--safe-b));max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cartes ---------- */
.card{position:relative;background:linear-gradient(150deg,#161616,#0b0b0b 70%);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;overflow:hidden}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card.hero{border-color:var(--line-strong);
  background:radial-gradient(120% 120% at 100% 0%,rgba(212,175,55,.18),transparent 50%),linear-gradient(150deg,#171717,#0a0a0a)}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px;
  background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .big.neg{background:none;color:var(--over)}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:16px;margin-top:3px}
.income{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:13px}
.income input{width:110px;background:#000;border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--gold-l)}

/* ---------- Alertes ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;margin:8px 0;font-size:14px;border:1px solid}
.alert.warn{border-color:rgba(240,160,60,.5);background:rgba(240,160,60,.08)}
.alert.over{border-color:rgba(242,85,90,.55);background:rgba(242,85,90,.09)}
.alert .ic{font-size:16px;line-height:1.2}
.alert small{display:block;color:var(--muted);margin-top:2px}

/* ---------- Budgets ---------- */
.brow{padding:10px 0;border-top:1px solid rgba(255,255,255,.05)}
.brow:first-of-type{border-top:0}
.btop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bname{display:flex;gap:8px;align-items:center;font-weight:500}
.bnum{font-size:13px;color:var(--muted);white-space:nowrap}
.bnum b{color:var(--text);font-weight:600}
.track{height:8px;border-radius:4px;background:#1d1d1d;margin-top:8px;overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--goldgrad);transition:width .4s}
.fill.warn{background:var(--warn)}.fill.over{background:var(--over)}.fill.goal{background:linear-gradient(90deg,#9c7a1c,#f3dc7c)}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;margin-left:4px;white-space:nowrap}
.tag.warn{color:var(--warn);border:1px solid rgba(240,160,60,.5)}
.tag.over{color:var(--over);border:1px solid rgba(242,85,90,.5)}
.tag.ok{color:var(--ok);border:1px solid rgba(92,201,138,.45)}
.sub{font-size:12px;color:var(--faint);margin-top:5px}

/* ---------- Tableau de comparaison ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:0 0 8px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 0;border-top:1px solid rgba(255,255,255,.05);text-align:right;white-space:nowrap}
td.up{color:var(--text)}td .ar{color:var(--muted);font-size:11px}
.sharebar{display:inline-block;height:4px;border-radius:2px;background:var(--gold);vertical-align:middle;margin-right:6px;opacity:.85}

/* ---------- Graphique tendance ---------- */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:#000;border:1px solid var(--line-strong);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);display:none}

/* ---------- Historique ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:7px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--goldgrad);color:#111;border-color:transparent;font-weight:600}
.day{font-size:12px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;margin:16px 4px 6px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);border:1px solid rgba(212,175,55,.12);margin:6px 0;width:100%;text-align:left}
.item .em{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#1a1a1a;border:1px solid var(--line);font-size:18px;flex:0 0 auto}
.item .tx{flex:1;min-width:0}
.item .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--muted);font-size:12px}
.item .amt{font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* ---------- Formulaires ---------- */
.field{margin:12px 0}
.field label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px}
.inp{width:100%;background:#000;border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.inp:focus{border-color:var(--gold)}
input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;min-height:48px}
.amount{font-size:34px;font-weight:700;text-align:center;color:var(--gold-l);padding:10px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cat{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 4px;font-size:12px;text-align:center;color:var(--muted);position:relative}
.cat span{display:block;font-size:20px;margin-bottom:3px}
.cat.on{border-color:var(--gold);color:var(--text);background:rgba(212,175,55,.12);box-shadow:0 0 0 1px var(--gold) inset}
.cat .auto{position:absolute;top:3px;right:5px;font-size:9px;color:var(--gold);letter-spacing:.05em}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;background:var(--goldgrad);color:#111;margin-top:14px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line-strong)}
.btn.danger{background:transparent;color:var(--over);border:1px solid rgba(242,85,90,.5)}
.row{display:flex;gap:8px;align-items:center}
.row>.field{min-width:0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- Réglages ---------- */
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.05)}
.srow:first-of-type{border-top:0}
.srow .n{flex:1}
.srow input{width:64px;text-align:right;background:#000;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.srow .eur{width:78px;text-align:right;color:var(--muted);font-size:13px}
.total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-weight:600}
.switch{width:46px;height:28px;border-radius:14px;background:#2a2a2a;border:1px solid var(--line);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#777;transition:.2s}
.switch.on{background:rgba(212,175,55,.35)}.switch.on::after{left:21px;background:var(--gold)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ---------- Barre d'onglets ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;align-items:center;
  padding:8px 6px calc(8px + var(--safe-b));background:rgba(8,8,8,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{background:none;border:0;color:var(--faint);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;letter-spacing:.04em}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
nav .add{width:58px;height:58px;border-radius:50%;background:var(--goldgrad);color:#111;margin-top:-26px;
  box-shadow:0 6px 24px rgba(212,175,55,.35),0 0 0 4px #070707;justify-content:center}
nav .add svg{width:28px;height:28px}

/* ---------- Feuille du bas ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;max-height:calc(100dvh - var(--safe-t) - 16px);overflow-y:auto;
  background:linear-gradient(#141414,#0a0a0a);border-top:1px solid var(--line-strong);border-radius:22px 22px 0 0;
  padding:10px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .28s ease;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.overlay{touch-action:none}
.shead{position:sticky;top:-10px;z-index:2;display:flex;align-items:center;justify-content:center;
  margin:-10px -18px 8px;padding:14px 18px 10px;background:#141414;border-bottom:1px solid rgba(212,175,55,.12)}
.sheet h3{margin:0;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center}
.xbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;
  border:1px solid var(--line);background:#0a0a0a;color:var(--gold);display:grid;place-items:center;padding:0}
.xbtn svg{width:18px;height:18px}

/* ---------- Mode voyage ---------- */
.mode{display:flex;border:1px solid var(--line);border-radius:20px;padding:3px;background:#0a0a0a;position:relative;z-index:1}
.mode button{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 11px;border-radius:16px;white-space:nowrap}
.mode button.on{background:var(--goldgrad);color:#111;font-weight:600}
.tripbar{text-align:center;margin-top:12px;display:none;position:relative}
.tripbar .tn{font-size:20px;font-weight:600}
.tripbar .td{font-size:12px;color:var(--muted);margin-top:3px}
.alert.info{border-color:var(--line-strong)}
.alert.info{background:rgba(212,175,55,.07)}
.curtog{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.conv{font-size:14px;color:var(--muted);text-align:center;margin-top:6px;min-height:18px}
.conv b{color:var(--gold-l)}
.qtable td{font-size:15px}
.swapbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:#0a0a0a;color:var(--gold);font-size:20px;display:grid;place-items:center;margin:8px auto}
.ratebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ratebox input{width:110px}
select.inp{-webkit-appearance:none;appearance:none}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translate(-50%,30px);opacity:0;z-index:40;pointer-events:none;
  background:#0d0d0d;border:1px solid var(--line-strong);border-radius:14px;padding:12px 16px;font-size:14px;
  width:max-content;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .3s ease,opacity .3s ease}
.toast.on{transform:translate(-50%,0);opacity:1}
.sheet.on~.toast{bottom:calc(var(--safe-b) + 24px)}
.toast.warn{border-color:var(--warn)}.toast.over{border-color:var(--over)}
</style>
</head>
<body>

<header>
  <svg class="swirl" viewBox="0 0 220 140" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e27a"/><stop offset=".5" stop-color="#d4af37"/><stop offset="1" stop-color="#6b5212"/></linearGradient></defs>
    <path d="M30 140 C 60 60, 140 10, 230 30" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
    <path d="M60 140 C 90 80, 160 45, 230 55" fill="none" stroke="url(#g)" stroke-width="2" opacity=".6"/>
  </svg>
  <div class="brand"><h1 id="brandT">Mon Budget</h1><div class="mode" id="modeSw"><button data-m="normal">Quotidien</button><button data-m="travel">✈️ Voyage</button></div></div>
  <div class="tripbar" id="tripbar"></div>
  <div class="monthnav" id="monthnav">
    <button id="prevM" aria-label="Mois précédent">‹</button>
    <div class="m" id="mLabel"></div>
    <button id="nextM" aria-label="Mois suivant">›</button>
  </div>
</header>

<main>
  <section class="view on" id="v-dash"></section>
  <section class="view" id="v-hist"></section>
  <section class="view" id="v-subs"></section>
  <section class="view" id="v-set"></section>
  <section class="view" id="v-tdash"></section>
  <section class="view" id="v-thist"></section>
  <section class="view" id="v-tconv"></section>
  <section class="view" id="v-tset"></section>
</main>

<nav id="nav"></nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Données de base
   ========================================================= */
const CATS = [
  {id:'quotidien', name:'Vie quotidienne', icon:'🛒', pct:15},
  {id:'dehors',    name:'Manger dehors',   icon:'🍔', pct:8},
  {id:'fun',       name:'Fun perso',       icon:'🎮', pct:8},
  {id:'abos',      name:'Abonnements',     icon:'📺', pct:4},
  {id:'transport', name:'Transport',       icon:'🚆', pct:8},
  {id:'shopping',  name:'Shopping',        icon:'👕', pct:5},
  {id:'sorties',   name:'Sorties & voyages',icon:'🎉', pct:5},
  {id:'sante',     name:'Santé',           icon:'💊', pct:3},
  {id:'cadeaux',   name:'Cadeaux',         icon:'🎁', pct:3},
  {id:'loyer',     name:'Logement',        icon:'🏠', pct:0},
  {id:'invest',    name:'Investissement',  icon:'📈', pct:25, goal:true},
  {id:'autre',     name:'Autre',           icon:'📦', pct:3},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));

// Mots-clés pour ranger automatiquement une dépense selon sa description
const KEYWORDS = {
  dehors:['mcdo','mcdonald','burger','bk','kfc','quick','uber eats','ubereats','deliveroo','just eat','sushi','pizza','kebab','tacos','o tacos','resto','restaurant','starbucks','brasserie','subway','five guys','poke','dejeuner','diner','fast food','crous','cafe','boba','bubble tea'],
  quotidien:['carrefour','leclerc','auchan','lidl','aldi','intermarche','monoprix','franprix','casino','super u','courses','supermarche','boulangerie','pain','lessive','menage','hygiene','shampoing','dentifrice','picard','marche','epicerie','grand frais','biocoop','action'],
  fun:['ps5','ps4','playstation','psn','steam','nintendo','switch','xbox','jeu','jeux','game','manga','fnac','micromania','v-bucks','vbucks','fortnite','gemmes','in game','skin','pass de combat','livre','bd','figurine','carte pokemon','lego','eneba','instant gaming'],
  abos:['netflix','spotify','disney','prime video','amazon prime','deezer','youtube premium','canal','abonnement','forfait','free mobile','sfr','orange','bouygues','icloud','chatgpt','claude','basic fit','salle de sport','crunchyroll','game pass','ps plus'],
  invest:['pea','livret','livret a','ldds','assurance vie','bourse','etf','crypto','bitcoin','cto','epargne','per'],
  cadeaux:['cadeau','anniversaire','anniv','noel','fete des','offert'],
  transport:['essence','carburant','sncf','train','tgv','ouigo','navigo','metro','uber','bolt','taxi','peage','parking','bus','blablacar','ratp','tcl','velib','trottinette','lime'],
  sante:['pharmacie','medecin','doctolib','dentiste','mutuelle','ophtalmo','kine','lunettes','lentilles','analyse'],
  shopping:['zara','h&m','hm','vetement','vetements','chaussures','nike','adidas','amazon','uniqlo','decathlon','shein','vinted','pull','jean','tshirt','t-shirt','veste','sneakers','ikea'],
  sorties:['cinema','cine','bar','concert','soiree','voyage','hotel','airbnb','billet','bowling','musee','festival','laser game','escape game','boite','club','biere','verre'],
  loyer:['loyer','apl','charges','edf','electricite','eau','assurance habitation','engie','internet box'],
};
const SUB_PRESETS = ['Netflix','Spotify','Disney+','Amazon Prime','Deezer','YouTube Premium','Canal+','PS Plus','Xbox Game Pass','Crunchyroll','iCloud','ChatGPT','Forfait mobile','Salle de sport'];

/* =========================================================
   Stockage (sur le téléphone uniquement)
   ========================================================= */
const KEY = 'mon-budget-v1';
function defaults(){
  return {
    expenses:[], incomes:{}, defaultIncome:1800,
    budgets:Object.fromEntries(CATS.map(c=>[c.id,c.pct])),
    subs:[], rules:{}, warnAt:80,
    trips:[], activeTrip:null, mode:'normal', trules:{},
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); const d = defaults();
      return {...d, ...s, budgets:{...d.budgets, ...(s.budgets||{})}}; }
  }catch(e){}
  return defaults();
}
let S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ Impossible d’enregistrer sur cet appareil','over'); }
}

/* =========================================================
   Outils
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const mKey = iso => iso.slice(0,7);
const nowM = () => mKey(todayISO());
const shiftM = (m,n) => { let [y,mo]=m.split('-').map(Number); mo+=n; while(mo>12){mo-=12;y++} while(mo<1){mo+=12;y--} return `${y}-${pad(mo)}`; };
const mName = (m,short) => new Date(m+'-15').toLocaleDateString('fr-FR', short?{month:'short'}:{month:'long',year:'numeric'});
const eur = (n,dec) => (Math.round(n*100)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:dec===0?0:2,minimumFractionDigits:dec===0?0:(Number.isInteger(Math.round(n*100)/100)?0:2)});
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9&+ -]/g,' ').replace(/\s+/g,' ').trim();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num = v => { const n = parseFloat(String(v).replace(',','.').replace(/\s/g,'')); return isFinite(n)?n:0; };

/* Devine la catégorie à partir de la description */
function guessCat(desc){ return guessIn(desc,S.rules,KEYWORDS); }
function guessIn(desc,rules,keywords){
  const d = norm(desc); if(!d) return null;
  if(rules[d]) return rules[d];                        // ce que tu as déjà choisi pour cette description
  let best=null, len=0; const padded=' '+d+' ';
  for(const [cat,words] of Object.entries(keywords)){
    for(const w of words){
      if(w.length>len && padded.includes(' '+w+' ') || (w.length>=5 && w.length>len && d.includes(w))){ best=cat; len=w.length; }
    }
  }
  return best;
}

/* =========================================================
   Calculs du mois
   ========================================================= */
const income = m => S.incomes[m] ?? S.defaultIncome;
const subsFor = m => S.subs.filter(s => s.start<=m && (!s.end || s.end>=m));
function totals(m){
  const by = Object.fromEntries(CATS.map(c=>[c.id,0]));
  for(const e of S.expenses) if(mKey(e.date)===m) by[e.cat]=(by[e.cat]||0)+e.amount;
  for(const s of subsFor(m)) by.abos += s.price;
  for(const t of S.trips) if(t.countInMonth) for(const e of t.expenses) if(mKey(e.date)===m) by.sorties += e.eur;
  const invest = by.invest;
  const spent = Object.entries(by).reduce((a,[k,v])=>k==='invest'?a:a+v,0);
  return {by, spent, invest};
}
const budgetOf = (cat,m) => income(m)*(S.budgets[cat]||0)/100;
function status(spent,budget){
  if(budget<=0) return spent>0?'over':'none';
  const r = spent/budget;
  if(r>1) return 'over';
  if(r*100>=S.warnAt) return 'warn';
  return 'ok';
}

/* =========================================================
   Tableau de bord
   ========================================================= */
function renderDash(){
  const t = totals(month), inc = income(month);
  const prev = totals(shiftM(month,-1));
  const left = inc - t.spent - t.invest;

  // Alertes
  const alerts = CATS.filter(c=>!c.goal).map(c=>{
    const b=budgetOf(c.id,month), s=t.by[c.id], st=status(s,b);
    return {c,b,s,st};
  }).filter(a=>a.st==='warn'||a.st==='over').sort((a,b)=>(b.st==='over')-(a.st==='over'));
  const alertHtml = alerts.map(a=> a.st==='over'
    ? `<div class="alert over"><span class="ic">⛔</span><div><b>${a.c.name} : budget dépassé</b><small>${eur(a.s)} sur ${eur(a.b)}${a.b>0?` · +${eur(a.s-a.b)} au-dessus`:' · aucun budget prévu'}</small></div></div>`
    : `<div class="alert warn"><span class="ic">⚠️</span><div><b>${a.c.name} : ${Math.round(a.s/a.b*100)} % du budget</b><small>Il reste ${eur(a.b-a.s)} jusqu’à la fin du mois</small></div></div>`
  ).join('');

  // Lignes de budget
  const rows = CATS.filter(c=>(S.budgets[c.id]||0)>0 || t.by[c.id]>0).map(c=>{
    const b=budgetOf(c.id,month), s=t.by[c.id];
    const pct = b>0?Math.min(100,s/b*100):(s>0?100:0);
    if(c.goal){
      const done = b>0 && s>=b;
      return `<div class="brow"><div class="btop"><div class="bname">${c.icon} ${c.name}${done?'<span class="tag ok">✓ Objectif atteint</span>':''}</div>
        <div class="bnum"><b>${eur(s)}</b> / ${eur(b,0)}</div></div>
        <div class="track"><div class="fill goal" style="width:${pct}%"></div></div>
        <div class="sub">Objectif d’épargne · ${S.budgets[c.id]||0} % du revenu</div></div>`;
    }
    const st=status(s,b);
    const tag = st==='over'?'<span class="tag over">⛔ Dépassé</span>':st==='warn'?'<span class="tag warn">⚠️ Attention</span>':'';
    return `<div class="brow"><div class="btop"><div class="bname">${c.icon} ${c.name}${tag}</div>
      <div class="bnum"><b>${eur(s)}</b> / ${eur(b,0)}</div></div>
      <div class="track"><div class="fill ${st==='ok'?'':st}" style="width:${pct}%"></div></div>
      ${b>0?`<div class="sub">${s<=b?`Reste ${eur(b-s)}`:`${eur(s-b)} de trop`} · ${S.budgets[c.id]} % du revenu</div>`:''}</div>`;
  }).join('');

  // Comparaison avec le mois précédent
  const cmpCats = CATS.filter(c=>t.by[c.id]>0||prev.by[c.id]>0).sort((a,b)=>t.by[b.id]-t.by[a.id]);
  const totAll = t.spent + t.invest || 1;
  const maxShare = Math.max(...cmpCats.map(c=>t.by[c.id]/totAll),0.0001);
  const cmp = cmpCats.map(c=>{
    const d = t.by[c.id]-prev.by[c.id], share=t.by[c.id]/totAll;
    const arrow = Math.abs(d)<0.005?'<span class="ar">=</span>':(d>0?`<span class="ar">▲</span> +${eur(d,0)}`:`<span class="ar">▼</span> −${eur(-d,0)}`);
    return `<tr><td>${c.icon} ${c.name}</td><td>${eur(t.by[c.id],0)}</td>
      <td><span class="sharebar" style="width:${Math.round(share/maxShare*36)}px"></span>${Math.round(share*100)} %</td><td>${arrow}</td></tr>`;
  }).join('');

  $('#v-dash').innerHTML = `
    <div class="card hero">
      <div class="lbl">Reste ce mois-ci</div>
      <div class="big ${left<0?'neg':''}">${eur(left)}</div>
      <div class="grid3">
        <div class="stat"><span class="lbl">Dépensé</span><b>${eur(t.spent,0)}</b></div>
        <div class="stat"><span class="lbl">Investi</span><b>${eur(t.invest,0)}</b></div>
        <div class="stat"><span class="lbl">Utilisé</span><b>${inc>0?Math.round((t.spent+t.invest)/inc*100):0} %</b></div>
      </div>
      <div class="income">Revenu du mois
        <input id="incInp" inputmode="decimal" value="${income(month)}"> €
      </div>
    </div>
    ${ongoingTrip()?`<button class="alert info" id="goTrip" style="width:100%;text-align:left;color:inherit"><span class="ic">✈️</span><div><b>Tu es en voyage : ${esc(ongoingTrip().name)}</b><small>Touche pour passer en mode voyage</small></div></button>`:''}
    ${alertHtml}
    <div class="card"><h2>Budgets</h2>${rows || '<div class="empty">Aucun budget défini</div>'}</div>
    <div class="card"><h2>Évolution des dépenses</h2><div class="chart" id="trend"></div>
      <div class="hint">Dépenses hors investissement · touche une barre pour voir le montant</div></div>
    <div class="card"><h2>Comparaison</h2>
      ${cmp?`<table><thead><tr><th>Catégorie</th><th>Ce mois</th><th>Part</th><th>vs ${mName(shiftM(month,-1),true)}</th></tr></thead><tbody>${cmp}</tbody></table>`
        :'<div class="empty">Pas encore de dépense ce mois-ci.<br>Touche ＋ pour commencer.</div>'}
    </div>`;

  if($('#goTrip')) $('#goTrip').onclick=()=>{S.activeTrip=ongoingTrip().id;setMode('travel')};
  $('#incInp').onchange = e => { S.incomes[month]=num(e.target.value); save(); renderDash(); };
  drawTrend();
}

function drawTrend(){
  const box=$('#trend'); const months=[...Array(6)].map((_,i)=>shiftM(month,i-5));
  const vals=months.map(m=>totals(m).spent);
  const budgetLine = months.map(m=>CATS.filter(c=>!c.goal).reduce((a,c)=>a+budgetOf(c.id,m),0));
  const max=Math.max(...vals,...budgetLine,1)*1.12;
  const W=320,H=150,top=8,bot=22, bw=30, gap=(W-bw*6)/6;
  const y=v=>top+(H-top-bot)*(1-v/max);
  let bars='';
  months.forEach((m,i)=>{
    const x=gap/2+i*(bw+gap), h=(H-bot)-y(vals[i]);
    const r=Math.min(4,h/2);
    const cur = m===month;
    bars += `<g data-i="${i}">
      <rect x="${x-gap/2}" y="0" width="${bw+gap}" height="${H}" fill="transparent"/>
      ${h>0?`<path d="M${x},${H-bot} V${y(vals[i])+r} q0,-${r} ${r},-${r} h${bw-2*r} q${r},0 ${r},${r} V${H-bot} Z" fill="${cur?'url(#gb)':'#6b5a2a'}"/>`:''}
      <text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="${cur?'#f2efe6':'#9a958a'}">${mName(m,true).replace('.','')}</text></g>`;
  });
  // ligne du budget total (même échelle, même unité)
  const bl = budgetLine.map((v,i)=>`${i?'L':'M'}${gap/2+i*(bw+gap)-4},${y(v)} h${bw+8}`).join(' ');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses des 6 derniers mois">
    <defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc7c"/><stop offset="1" stop-color="#a8811f"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="#2a2a2a"/>
    ${bars}
    <path d="${budgetLine.map((v,i)=>`M${gap/2+i*(bw+gap)-4},${y(v)} h${bw+8}`).join(' ')}" stroke="#9a958a" stroke-width="1.5" stroke-dasharray="3 3"/>
  </svg><div class="tip"></div>
  <div class="hint" style="margin-top:4px">┄ budget total prévu (hors investissement)</div>`;
  const tip=box.querySelector('.tip');
  box.querySelectorAll('g[data-i]').forEach(g=>{
    const show=()=>{const i=+g.dataset.i; const r=g.querySelector('rect').getBoundingClientRect(), b=box.getBoundingClientRect();
      tip.innerHTML=`<b>${mName(months[i])}</b><br>Dépensé : ${eur(vals[i])}<br>Budget : ${eur(budgetLine[i],0)}`;
      tip.style.left=(r.left-b.left+r.width/2)+'px'; tip.style.top=(y(vals[i])/H*b.width*H/W)+'px'; tip.style.display='block';};
    g.addEventListener('mouseenter',show); g.addEventListener('click',show);
    g.addEventListener('mouseleave',()=>tip.style.display='none');
  });
}

/* =========================================================
   Historique
   ========================================================= */
function renderHist(){
  let list = S.expenses.filter(e=>mKey(e.date)===month).map(e=>({...e}));
  subsFor(month).forEach(s=>list.push({id:'sub-'+s.id, sub:true, date:`${month}-${pad(Math.min(s.day||1,28))}`, amount:s.price, desc:s.name, cat:'abos'}));
  S.trips.filter(t=>t.countInMonth).forEach(t=>t.expenses.filter(e=>mKey(e.date)===month).forEach(e=>list.push({id:'trip-'+e.id, trip:true, date:e.date, ts:e.ts, amount:e.eur, desc:`✈️ ${t.name} · ${e.desc||TCAT[e.cat].name}`, cat:'sorties'})));
  const used = [...new Set(list.map(e=>e.cat))];
  if(histFilter!=='all') list = list.filter(e=>e.cat===histFilter);
  list.sort((a,b)=>b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0));
  const total = list.reduce((a,e)=>a+e.amount,0);

  let html = `<div class="chips"><button class="chip ${histFilter==='all'?'on':''}" data-f="all">Tout</button>${
    CATS.filter(c=>used.includes(c.id)).map(c=>`<button class="chip ${histFilter===c.id?'on':''}" data-f="${c.id}">${c.icon} ${c.name}</button>`).join('')}</div>`;
  if(!list.length) html += `<div class="empty">Rien pour ce mois-ci.</div>`;
  else{
    html += `<div class="hint" style="margin:4px">${list.length} ligne${list.length>1?'s':''} · total ${eur(total)}</div>`;
    let day='';
    for(const e of list){
      if(e.date!==day){ day=e.date; html += `<div class="day">${new Date(day+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>`; }
      const c=CAT[e.cat]||CAT.autre;
      html += `<button class="item" data-id="${e.id}"><div class="em">${c.icon}</div>
        <div class="tx"><div>${esc(e.desc||c.name)}</div><small>${c.name}${e.sub?' · abonnement auto':''}${e.trip?' · voyage':''}</small></div>
        <div class="amt">${eur(e.amount)}</div></button>`;
    }
  }
  $('#v-hist').innerHTML = html;
  document.querySelectorAll('#v-hist .chip').forEach(b=>b.onclick=()=>{histFilter=b.dataset.f;renderHist()});
  document.querySelectorAll('#v-hist .item').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(id.startsWith('sub-')){ show('subs'); return; }
    if(id.startsWith('trip-')){ toast('Dépense de voyage : modifiable en mode ✈️ Voyage'); return; }
    openExpense(S.expenses.find(e=>e.id===id));
  });
}

/* =========================================================
   Ajout / modification d'une dépense
   ========================================================= */
function openExpense(exp){
  const editing = !!exp;
  let chosen = exp?exp.cat:null, manual = editing;
  const sh=$('#sheet');
  sh.innerHTML = `<div class="shead"><h3>${editing?'Modifier':'Nouvelle dépense'}</h3>
      <button class="xbtn" id="fClose" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <input class="inp amount" id="fAmt" inputmode="decimal" placeholder="0,00 €" value="${exp?String(exp.amount).replace('.',','):''}">
    <div class="field"><label>Description</label><input class="inp" id="fDesc" placeholder="ex : Uber Eats, courses Lidl, manga…" value="${exp?esc(exp.desc):''}" autocomplete="off"></div>
    <div class="field"><label>Catégorie</label><div class="catgrid" id="fCats"></div>
      <div class="hint" id="fHint"></div></div>
    <div class="field"><label>Date</label><input class="inp" type="date" id="fDate" value="${exp?exp.date:todayISO()}"></div>
    <button class="btn" id="fSave">${editing?'Enregistrer':'Ajouter'}</button>
    ${editing?'<button class="btn danger" id="fDel">Supprimer</button>':''}`;
  const drawCats=()=>{
    const g = guessCat($('#fDesc').value);
    if(!manual) chosen = g;
    $('#fCats').innerHTML = CATS.map(c=>`<button class="cat ${chosen===c.id?'on':''}" data-c="${c.id}">${!manual&&g===c.id?'<i class="auto">AUTO</i>':''}<span>${c.icon}</span>${c.name}</button>`).join('');
    $('#fHint').textContent = !manual&&g ? 'Catégorie devinée à partir de la description · touche une autre pour changer' : (!chosen?'Choisis une catégorie':'');
    $('#fCats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{chosen=b.dataset.c;manual=true;drawCats()});
  };
  drawCats();
  $('#fClose').onclick=closeSheet;
  $('#fDesc').oninput=drawCats;
  $('#fSave').onclick=()=>{
    const amount=num($('#fAmt').value), desc=$('#fDesc').value.trim(), date=$('#fDate').value||todayISO();
    if(amount<=0){ toast('Entre un montant'); $('#fAmt').focus(); return; }
    if(!chosen){ toast('Choisis une catégorie'); return; }
    // retiens ton choix si l'appli s'était trompée (ou n'avait pas deviné)
    if(desc && guessCat(desc)!==chosen) S.rules[norm(desc)] = chosen;
    const m=mKey(date), b=budgetOf(chosen,m), before=status(totals(m).by[chosen],b);
    if(editing) Object.assign(exp,{amount,desc,cat:chosen,date});
    else S.expenses.push({id:uid(),ts:Date.now(),amount,desc,cat:chosen,date});
    save(); closeSheet();
    const after=status(totals(m).by[chosen],b), c=CAT[chosen];
    if(!c.goal && after==='over' && before!=='over') toast(`⛔ ${c.name} : budget dépassé (${eur(totals(m).by[chosen])} / ${eur(b,0)})`,'over',4200);
    else if(!c.goal && after==='warn' && before==='ok') toast(`⚠️ ${c.name} : ${Math.round(totals(m).by[chosen]/b*100)} % du budget atteint`,'warn',4200);
    else if(c.goal && b>0 && totals(m).by[chosen]>=b && totals(m).by[chosen]-amount<b) toast('📈 Objectif d’investissement atteint, bravo !','',3500);
    else toast(editing?'✓ Modifié':`✓ ${eur(amount)} · ${c.name}`);
    if(view!=='dash'&&view!=='hist') show('dash'); else render();
  };
  if(editing) $('#fDel').onclick=()=>{ S.expenses=S.expenses.filter(e=>e.id!==exp.id); save(); closeSheet(); render(); toast('Dépense supprimée'); };
  openSheet();
  if(!editing) setTimeout(()=>$('#fAmt').focus(),300);
}
// Bloque le défilement de la page derrière la fenêtre (nécessaire sur iPhone)
let lockY=0;

  document.activeElement&&document.activeElement.blur();
  $('#overlay').classList.remove('on'); $('#sheet').classList.remove('on');
  if(document.body.style.position==='fixed'){ document.body.style.cssText=''; window.scrollTo(0,lockY); }
}

async function exportData(){
  const name=`budget-${todayISO()}.json`, blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});

const ongoingTrip = () => { const d=todayISO(); return S.trips.find(t=>t.start && t.end && t.start<=d && d<=t.end) || null; };
const r2 = n => Math.round(n*100)/100;
function fmtC(n,code){
  const dec = (Number.isInteger(r2(n)) || Math.abs(n)>=1000) ? 0 : 2;
  try{ return n.toLocaleString('fr-FR',{style:'currency',currency:code,minimumFractionDigits:dec,maximumFractionDigits:dec}); }
  catch(e){ return `${n.toLocaleString('fr-FR',{maximumFractionDigits:dec})} ${code}`; }
}
const fmtRate = n => n.toLocaleString('fr-FR',{maximumSignificantDigits:4});
const dayDiff = (a,b) => Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const addDays = (iso,n) => { const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const shortDate = iso => new Date(iso+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});

function tripStats(t){
  const by = Object.fromEntries(TCATS.map(c=>[c.id,0])), byDay={};
  let total=0;
  for(const e of t.expenses){ total+=e.eur; by[e.cat]=(by[e.cat]||0)+e.eur; byDay[e.date]=(byDay[e.date]||0)+e.eur; }
  const hasDates = t.start && t.end && t.end>=t.start;
  const nDays = hasDates ? dayDiff(t.start,t.end)+1 : 0;
  const today = todayISO();
  const inTrip = hasDates && t.start<=today && today<=t.end;
  const dayIdx = inTrip ? dayDiff(t.start,today)+1 : 0;           // jour n° X du voyage
  const daysLeft = !hasDates ? 0 : today<t.start ? nDays : inTrip ? nDays-dayIdx+1 : 0; // aujourd'hui compris
  const elapsed = !hasDates ? Object.keys(byDay).length||1 : today<t.start ? 0 : inTrip ? dayIdx : nDays;
  const daily = t.budget>0 && nDays ? t.budget/nDays : 0;
  return {by, byDay, total, hasDates, nDays, inTrip, dayIdx, daysLeft, elapsed, daily};
}

function drawDays(t,st){
  const box=$('#dayChart'), n=st.nDays;
  const days=[...Array(n)].map((_,i)=>addDays(t.start,i)), vals=days.map(d=>st.byDay[d]||0);
  const max=Math.max(...vals,st.daily,1)*1.12;
  const W=320,H=140,top=8,bot=22, slot=W/n, bw=Math.max(3,Math.min(26,slot*0.7));
  const y=v=>top+(H-top-bot)*(1-v/max), today=todayISO();
  const every = Math.ceil(n/8);
  let g='';
  days.forEach((d,i)=>{
    const x=i*slot+(slot-bw)/2, h=(H-bot)-y(vals[i]), r=Math.min(3,h/2,bw/2);
    const over = st.daily && vals[i]>st.daily;
    g+=`<g data-i="${i}"><rect x="${i*slot}" y="0" width="${slot}" height="${H}" fill="transparent"/>
      ${h>0?`<path d="M${x},${H-bot} V${y(vals[i])+r} q0,-${r} ${r},-${r} h${bw-2*r} q${r},0 ${r},${r} V${H-bot} Z" fill="${over?'var(--warn)':d===today?'url(#gb2)':'#8a7330'}"/>`:''}
      ${(i%every===0||d===today)?`<text x="${i*slot+slot/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="${d===today?'#f2efe6':'#9a958a'}">${new Date(d+'T12:00').getDate()}</text>`:''}</g>`;
  });
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dépenses par jour du voyage">
    <defs><linearGradient id="gb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc7c"/><stop offset="1" stop-color="#a8811f"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${H-bot}" y2="${H-bot}" stroke="#2a2a2a"/>${g}
    ${st.daily?`<line x1="0" x2="${W}" y1="${y(st.daily)}" y2="${y(st.daily)}" stroke="#9a958a" stroke-width="1.5" stroke-dasharray="3 3"/>`:''}
  </svg><div class="tip"></div>`;
  const tip=box.querySelector('.tip');
  box.querySelectorAll('g[data-i]').forEach(el=>{
    const sh=()=>{const i=+el.dataset.i, r=el.querySelector('rect').getBoundingClientRect(), b=box.getBoundingClientRect();
      tip.innerHTML=`<b>${new Date(days[i]+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</b><br>${eur(vals[i])} · ${fmtC(vals[i]*t.rate,t.cur)}`;
      tip.style.left=Math.min(Math.max(r.left-b.left+r.width/2,60),b.width-60)+'px'; tip.style.top=(y(vals[i])/H*b.width*H/W)+'px'; tip.style.display='block';};
    el.addEventListener('mouseenter',sh); el.addEventListener('click',sh);
    el.addEventListener('mouseleave',()=>tip.style.display='none');
  });
}

    const a=num($('#fAmt').value);
    $('#fAmt').placeholder = cur==='EUR' ? '0,00 €' : `0 ${t.cur}`;
    $('#fConv').innerHTML = !a ? (cur==='EUR'?'Montant en euros':`Montant en ${t.cur} · 1 € = ${fmtRate(rateOf())} ${t.cur}`)
      : cur==='EUR' ? `≈ <b>${fmtC(a*rateOf(),t.cur)}</b>` : `≈ <b>${eur(a/rateOf())}</b>`;
  };
  const drawCats=()=>{
    const g=guessIn($('#fDesc').value,S.trules,TKEYWORDS);
    if(!manual) chosen=g;
    $('#fCats').innerHTML=TCATS.map(c=>`<button class="cat ${chosen===c.id?'on':''}" data-c="${c.id}">${!manual&&g===c.id?'<i class="auto">AUTO</i>':''}<span>${c.icon}</span>${c.name}</button>`).join('');
    $('#fHint').textContent = !manual&&g ? 'Catégorie devinée · touche une autre pour changer' : (!chosen?'Choisis une catégorie':'');
    $('#fCats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{chosen=b.dataset.c;manual=true;drawCats()});
  };
  drawCur(); drawConv(); drawCats();
  $('#fAmt').oninput=drawConv; $('#fDesc').oninput=drawCats; $('#fClose').onclick=closeSheet;
  $('#fSave').onclick=()=>{
    const amount=num($('#fAmt').value), desc=$('#fDesc').value.trim(), date=$('#fDate').value||todayISO();
    if(amount<=0){ toast('Entre un montant'); return; }
    if(!chosen){ toast('Choisis une catégorie'); return; }
    if(desc && guessIn(desc,S.trules,TKEYWORDS)!==chosen) S.trules[norm(desc)]=chosen;
    const rate = cur==='EUR' ? 1 : rateOf();
    const eurAmt = cur==='EUR' ? amount : amount/rate;
    const before = tripStats(t).total;
    const data = {amount, cur, rate, eur:eurAmt, desc, cat:chosen, date};
    if(editing) Object.assign(exp,data); else t.expenses.push({id:uid(), ts:Date.now(), ...data});
    save(); closeSheet();
    const st=tripStats(t), b=t.budget;
    if(b>0 && st.total>b && before<=b) toast(`⛔ Budget voyage dépassé (${eur(st.total)} / ${eur(b,0)})`,'over',4200);
    else if(b>0 && st.total/b*100>=S.warnAt && before/b*100<S.warnAt) toast(`⚠️ ${Math.round(st.total/b*100)} % du budget voyage utilisé`,'warn',4200);
    else if(st.daily && date===todayISO() && (st.byDay[date]||0)>st.daily && (st.byDay[date]-eurAmt)<=st.daily) toast(`⚠️ Budget du jour dépassé (${eur(st.byDay[date])} / ${eur(st.daily,0)})`,'warn',4200);
    else toast(editing?'✓ Modifié':`✓ ${cur==='EUR'?eur(amount):`${fmtC(amount,cur)} ≈ ${eur(eurAmt)}`}`);
    render();
  };
  if(editing) $('#fDel').onclick=()=>{ t.expenses=t.expenses.filter(e=>e.id!==exp.id); save(); closeSheet(); render(); toast('Dépense supprimée'); };
  openSheet();
  if(!editing) setTimeout(()=>$('#fAmt').focus(),300);
}

/* ---------- Convertisseur (hors ligne) ---------- */
let convDir='toEur', convVal='';
function renderTConv(){
  const t=trip();
  if(!t){ $('#v-tconv').innerHTML='<div class="empty">Crée d’abord un voyage.</div>'; return; }
  const from = convDir==='toEur'?t.cur:'EUR', to = convDir==='toEur'?'EUR':t.cur;
  const conv = v => convDir==='toEur' ? v/t.rate : v*t.rate;
  const base = t.rate>=500?[1000,5000,10000,20000,50000,100000,200000,500000]
             : t.rate>=50?[100,500,1000,2000,5000,10000,20000,50000]
             : t.rate>=5?[10,50,100,200,500,1000,2000,5000]
             : [1,5,10,20,50,100,200,500];
  const quick = convDir==='toEur' ? base : [1,5,10,20,50,100,200,500];
  $('#v-tconv').innerHTML=`
    <div class="card hero">
      <div class="lbl" style="text-align:center">${from==='EUR'?'Euros':CURRENCIES.find(c=>c[0]===from)?.[1]||from}</div>
      <input class="inp amount" id="cIn" inputmode="decimal" placeholder="0" value="${esc(convVal)}">
      <button class="swapbtn" id="cSwap" aria-label="Inverser">⇅</button>
      <div class="lbl" style="text-align:center">${to==='EUR'?'Euros':CURRENCIES.find(c=>c[0]===to)?.[1]||to}</div>
      <div class="big" id="cOut" style="text-align:center">—</div>
      <div class="hint" style="text-align:center">Taux : 1 € = ${fmtRate(t.rate)} ${t.cur} · modifiable dans Voyages</div>
    </div>
    <div class="card"><h2>Repères rapides</h2>
      <table class="qtable"><tbody>${quick.map(v=>`<tr><td>${fmtC(v,from)}</td><td>${fmtC(conv(v),to)}</td></tr>`).join('')}</tbody></table>
    </div>`;
  const upd=()=>{ convVal=$('#cIn').value; const v=num(convVal); $('#cOut').textContent = v?fmtC(conv(v),to):'—'; };
  $('#cIn').oninput=upd; upd();
  $('#cSwap').onclick=()=>{ const v=num(convVal); convDir=convDir==='toEur'?'fromEur':'toEur'; convVal=v?String(r2(conv(v))).replace('.',','):''; renderTConv(); };
}

/* ---------- Gestion des voyages ---------- */
function newTrip(){
  const t={id:uid(), name:'Mon voyage', cur:'USD', rate:1.08, budget:0, start:todayISO(), end:addDays(todayISO(),6), countInMonth:false, expenses:[]};
  S.trips.push(t); S.activeTrip=t.id; save(); return t;
}
function renderTSet(){
  const t=trip();
  const tripsChips = S.trips.length>1 ? `<div class="card"><h2>Mes voyages</h2><div class="chips" style="flex-wrap:wrap">${
    S.trips.map(x=>`<button class="chip ${x.id===S.activeTrip?'on':''}" data-trip="${x.id}">✈️ ${esc(x.name)}</button>`).join('')}</div></div>` : '';
  if(!t){
    $('#v-tset').innerHTML = tripsChips+`<div class="card" style="text-align:center"><div class="empty" style="padding:20px 0">Aucun voyage pour l’instant.</div><button class="btn" id="tNew">＋ Nouveau voyage</button></div>`;
    bindTripChips(); $('#tNew').onclick=()=>{newTrip();renderTSet();}; return;
  }
  const known = CURRENCIES.some(c=>c[0]===t.cur);
  $('#v-tset').innerHTML = tripsChips + `
    <div class="card"><h2>Voyage</h2>
      <div class="field"><label>Nom</label><input class="inp" id="tName" value="${esc(t.name)}" placeholder="ex : Japon"></div>
      <div class="row"><div class="field" style="flex:1"><label>Départ</label><input class="inp" type="date" id="tStart" value="${t.start||''}"></div>
        <div class="field" style="flex:1"><label>Retour</label><input class="inp" type="date" id="tEnd" value="${t.end||''}"></div></div>
      <div class="field"><label>Budget total (en €)</label><input class="inp" id="tBudget" inputmode="decimal" value="${t.budget||''}" placeholder="ex : 1500 (laisser vide si aucun)"></div>
      <div class="hint" id="tDaily"></div>
    </div>
    <div class="card"><h2>Devise & taux</h2>
      <div class="field"><label>Devise du pays</label>
        <select class="inp" id="tCur">${CURRENCIES.map(([c,n])=>`<option value="${c}" ${c===t.cur?'selected':''}>${c} · ${n}</option>`).join('')}
          <option value="__other" ${known?'':'selected'}>Autre…</option></select></div>
      <div class="field" id="tOtherW" style="display:${known?'none':'block'}"><label>Code de la devise (3 lettres)</label>
        <input class="inp" id="tOther" maxlength="3" value="${known?'':esc(t.cur)}" placeholder="ex : PEN" style="text-transform:uppercase"></div>
      <div class="field"><label>Taux de change</label>
        <div class="ratebox"><span>1 € =</span><input class="inp" id="tRate" inputmode="decimal" value="${String(t.rate).replace('.',',')}"><span id="tCurLbl">${t.cur}</span></div>
        <div class="hint" id="tInv"></div></div>
      <div class="hint">Astuce : regarde le taux avant de partir, ou sur ton ticket de change ou ton relevé bancaire. Les dépenses déjà saisies gardent le taux du moment où tu les as ajoutées.</div>
      ${t.expenses.some(e=>e.cur!=='EUR'&&e.rate!==t.rate)?'<button class="btn ghost" id="tApply">Appliquer ce taux à toutes les dépenses du voyage</button>':''}
    </div>
    <div class="card"><h2>Budget du mois</h2>
      <div class="srow"><div class="n">Compter ce voyage dans mon budget mensuel<div class="sub">Ajouté à « Sorties & voyages » en mode Quotidien</div></div>
      <button class="switch ${t.countInMonth?'on':''}" id="tCount" aria-label="Compter dans le budget mensuel"></button></div>
    </div>
    <button class="btn ghost" id="tNew">＋ Nouveau voyage</button>
    <button class="btn danger" id="tDel">Supprimer ce voyage</button>`;
  const upd=()=>{
    $('#tInv').textContent = t.rate>0 ? `soit 1 ${t.cur} = ${fmtRate(1/t.rate)} €` : '';
    const st=tripStats(t);
    $('#tDaily').textContent = t.budget>0 && st.nDays ? `${st.nDays} jours → ${eur(t.budget/st.nDays)} par jour (≈ ${fmtC(t.budget/st.nDays*t.rate,t.cur)})` : (st.nDays?`${st.nDays} jours`:'');
    $('#tCurLbl').textContent=t.cur; renderTripBar();
  };
  upd();
  $('#tName').oninput=e=>{t.name=e.target.value.trim()||'Mon voyage';save();renderTripBar();};
  $('#tStart').onchange=e=>{t.start=e.target.value; if(t.end&&t.end<t.start) t.end=t.start; save(); renderTSet();};
  $('#tEnd').onchange=e=>{t.end=e.target.value; save(); upd();};
  $('#tBudget').oninput=e=>{t.budget=num(e.target.value);save();upd();};
  $('#tRate').oninput=e=>{const r=num(e.target.value); if(r>0){t.rate=r;save();upd();}};
  $('#tRate').onchange=()=>renderTSet();
  $('#tCur').onchange=e=>{
    if(e.target.value==='__other'){ $('#tOtherW').style.display='block'; $('#tOther').focus(); return; }
    t.cur=e.target.value; if(t.cur==='EUR') t.rate=1; save(); renderTSet(); toast('Pense à mettre à jour le taux');
  };
  $('#tOther').onchange=e=>{const c=e.target.value.trim().toUpperCase(); if(/^[A-Z]{3}$/.test(c)){t.cur=c;save();renderTSet();} else toast('3 lettres, ex : PEN');};
  if($('#tApply')) $('#tApply').onclick=()=>{ t.expenses.forEach(e=>{ if(e.cur!=='EUR'){ e.rate=t.rate; e.eur=e.amount/t.rate; } }); save(); renderTSet(); toast('✓ Taux appliqué à tout le voyage'); };
  $('#tCount').onclick=()=>{t.countInMonth=!t.countInMonth;save();renderTSet();};
  $('#tNew').onclick=()=>{newTrip();renderTSet();toast('Nouveau voyage créé');};
  $('#tDel').onclick=function(){
    if(!this.dataset.armed){ this.dataset.armed='1'; this.textContent=`Supprimer « ${t.name} » et ses ${t.expenses.length} dépenses ?`; setTimeout(()=>{ if(this.isConnected){delete this.dataset.armed; this.textContent='Supprimer ce voyage';} },3000); return; }
    S.trips=S.trips.filter(x=>x.id!==t.id); S.activeTrip=S.trips[0]?.id||null; save(); renderTSet(); toast('Voyage supprimé');
  };
  bindTripChips();
}
function bindTripChips(){
  document.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{S.activeTrip=b.dataset.trip;save();renderTSet();});
}

/* =========================================================
   Petit message en haut de l'écran
   ========================================================= */
let tt;
function toast(msg,kind='',ms=2200){
  const t=$('#toast'); t.className='toast '+kind; t.textContent=msg;
  requestAnimationFrame(()=>t.classList.add('on'));
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),ms);
}

show(view);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
